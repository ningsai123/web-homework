<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>web课程3-1级标签</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
            background: #f5f5f5;
        }
      
        .nav {
            background: #1a237e;
            height: 50px;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }
        
        .welcome,
        .nav-list > li > a {
            color: #ffffff;
            font-size: 15px;
        }
        .welcome {
            padding-left: 10px;
        }
        .nav-list {
            list-style: none;
            display: flex;
            margin-left: auto;
        }
        .nav-list > li {
            position: relative;
        }
        .nav-list > li > a {
            display: block;
            text-decoration: none;
            padding: 0 28px;
            line-height: 50px;
            border-left: 1px solid #2c3aa8;
            transition: background-color 0.2s ease;
        }
        .nav-list > li > a:hover {
            background: #3949ab;
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="welcome">欢迎访问湖南文理学院</div>
        <ul class="nav-list">
            <li><a href="#">教学院(部)</a></li>
            <li><a href="#">党群机构</a></li>
            <li><a href="#">行政教辅机构</a></li>
            <li><a href="#">信息系统</a></li>
            <li><a href="#">国际交流</a></li>
            <li><a href="#">数字图书馆</a></li>
            <li><a href="#">采购信息</a></li>
            <li><a href="#">办事大厅</a></li>
        </ul>
    </nav>
</body>
</html>
